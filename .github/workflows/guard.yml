# Checks every pull request against the folder rules and file rules, and lets members' own-folder changes merge
# themselves. Runs the guard from the BASE branch: pull request code is never checked out or run.
name: guard
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  pull_request_review:
    types: [submitted, dismissed]
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2
      - id: g
        run: python tools/ch.py guard --pr "${{ github.event.pull_request.number }}"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Merge own-folder changes by themselves
        if: steps.g.outputs.own_only == 'true'
        run: gh pr merge "${{ github.event.pull_request.number }}" --auto --squash --repo "${{ github.repository }}" || echo "auto-merge not enabled or not needed"
        env:
          GH_TOKEN: ${{ github.token }}
