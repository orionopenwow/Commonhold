name: tests
on:
  pull_request:
    paths: ["tools/**", "commonhold.yml"]
  push:
    branches: [main]
    paths: ["tools/**", "commonhold.yml"]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2 pytest==8.3.3
      - run: python -m pytest -q tools
